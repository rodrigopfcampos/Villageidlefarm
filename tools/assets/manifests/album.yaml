# Álbum de cartas (v4/album_livro.jpg) -> atlas_ui. Escala 1:1 (a folha já está no tamanho de interface).
#   ui/album_book: o livro inteiro como foi desenhado (com fitas e setas pintadas e os 8 espaços escuros).
#   ui/album_arrow_left / _right: setas de navegação recortadas pelo contorno (mesma posição do livro,
#     para desenhar por cima com destaque ao tocar). ui/album_tab_blue/green/red/purple: as fitas
#     (azul da esquerda; verde, vermelha e roxa da direita, que aparecem inteiras).
# Posição de cada peça e dos 8 espaços de carta (ALBUM_SLOTS, ALBUM_PARTS) em px do quadro ui/album_book:
# ver assetKeys.ts. Ordem dos espaços: página esquerda 1-4 (linha por linha), página direita 5-8.
