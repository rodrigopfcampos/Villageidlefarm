  - duck/walk_3
  - duck/walk_4
  - duck/graze_0
  - goose/walk_0
  - goose/walk_1
  - goose/walk_2
  - goose/walk_3
  - goose/walk_4
  - goose/graze_0
  - rabbit/walk_0
  - rabbit/walk_1
  - rabbit/walk_2
  - rabbit/walk_3
  - rabbit/walk_4
  - rabbit/graze_0
  - turkey/walk_0
  - turkey/walk_1
