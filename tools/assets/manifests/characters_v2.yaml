# Personagens v2 (fazendeiro e fazendeira) -> atlas_characters. Substitui farmer_m/farmer_f da folha antiga.
# Direções: down = de frente | up = de costas | side = perfil olhando para a DIREITA (para a esquerda: flipX)
#           left = quadro desenhado olhando para a esquerda (use se preferir não espelhar).
# A folha NÃO tem ciclos de caminhada limpos de 4 quadros. O que foi montado:
#   farmer_m walk_down_0..3: 4 quadros de frente (só 1 e 3 mostram passo; 0 e 2 são quase parados)
#            walk_up_0..3:   4 quadros de costas/3-4 de costas (passo leve)
#            walk_side_0..3: 3 perfis andando (linha 4) + 1 3/4 andando (linha 2)
#            walk_left_0..2: 3 quadros andando para a esquerda (linha 3)
#            idle_down_0/1, idle_up_0, idle_side_0/1
#            plant_side_0..2: NÃO EXISTE do fazendeiro. Os apelidos apontam para farmer_mixed (INCONSISTENTE).
#            water_*/harvest_*: NÃO EXISTEM (falta arte).
#   farmer_mixed plant_side_0..2: linha 4, colunas 6-8. INCONSISTENTE: corpo do fazendeiro (camisa vermelha,
#            macacão azul) com a cabeça/lenço da fazendeira. Use só como provisório.
#   farmer_f walk_down_0..2: só 3 quadros de frente (sem passo visível); walk_down_3 = apelido de walk_down_1
#            walk_up_0..3: 4 quadros de costas andando
#            walk_side_0..3: 3/4 de costas para a direita andando (não há perfil puro andando)
#            walk_left_0: 1 quadro andando para a esquerda
#            idle_down_0/1, idle_up_0..4, idle_side_0, idle_left_0
#            plant_side_0..2 (ajoelhada plantando), harvest_side_0/1 (colhendo com cesta),
#            water_side_0..4 (regando; 3 e 4 vêm da linha 4 da folha, mesmo personagem)
sheet: characters_v2
# ATUALIZAÇÃO: farmer_m agora vem de farmer_v3.yaml (folha fazendeiro_animais_v3.jpg). Daqui só ficam os
# (v4) nada do fazendeiro: farmer_m vem todo de farmer_v4.yaml. Os quadros "old_m" (frente/costas
# antigos) e "farmer_mixed" (ações inconsistentes) são descartados.
drop_entities: [old_m, farmer_mixed]
source: v2/personagens_v2.jpg
category: characters
transparency: flood
